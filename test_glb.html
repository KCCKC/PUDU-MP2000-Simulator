<!DOCTYPE html>
<html>
<head>
  <title>Test GLB Fork/Chassis Separation</title>
</head>
<body>
  <div id="status">Testing...</div>
  <script src="js/libs/three.min.js"></script>
  <script src="js/libs/DRACOLoader.js"></script>
  <script src="js/libs/GLTFLoader.js"></script>
  <script>
    const dracoLoader = new THREE.DRACOLoader();
    dracoLoader.setDecoderPath('js/libs/draco/');
    const loader = new THREE.GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    loader.load('models/MP2000-optimized.glb', (gltf) => {
      let originalMesh = null;
      gltf.scene.traverse((child) => {
        if (child.isMesh && !originalMesh) originalMesh = child;
      });

      if (!originalMesh) {
        document.getElementById('status').textContent = 'ERROR: No mesh found';
        return;
      }

      const geom = originalMesh.geometry;
      const index = geom.index;
      const pos = geom.attributes.position;

      const chassisIndices = [];
      const forkIndices = [];

      for (let i = 0; i < index.count; i += 3) {
        const a = index.getX(i);
        const b = index.getX(i + 1);
        const c = index.getX(i + 2);

        const avgX = (pos.getX(a) + pos.getX(b) + pos.getX(c)) / 3;
        const avgY = (pos.getY(a) + pos.getY(b) + pos.getY(c)) / 3;

        if (avgX > -0.33 && avgY < -0.62) {
          forkIndices.push(a, b, c);
        } else {
          chassisIndices.push(a, b, c);
        }
      }

      const chassisGeom = geom.clone();
      chassisGeom.setIndex(chassisIndices);
      const chassisMesh = new THREE.Mesh(chassisGeom, originalMesh.material);

      const forksGeom = geom.clone();
      forksGeom.setIndex(forkIndices);
      const forksMesh = new THREE.Mesh(forksGeom, originalMesh.material);

      document.getElementById('status').innerHTML = `
        SUCCESS: Split geometry!<br>
        Total Triangles: ${index.count / 3}<br>
        Chassis Triangles: ${chassisIndices.length / 3}<br>
        Fork Triangles: ${forkIndices.length / 3}
      `;
    }, null, (err) => {
      document.getElementById('status').textContent = 'ERROR: ' + err.message;
    });
  </script>
</body>
</html>
